name: platform-cli CI

on:
  push:
    branches: [main]
    paths:
      - "_core/platform-cli/**"
      - ".github/workflows/platform-cli-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "_core/platform-cli/**"
      - ".github/workflows/platform-cli-ci.yml"

defaults:
  run:
    working-directory: _core/platform-cli

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check apps_platform/ tests/
      - name: Ruff format check
        run: ruff format --check apps_platform/ tests/

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=apps_platform --cov-report=xml --cov-fail-under=60

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --strict
