[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-cli"
version = "1.0.0"
description = "CLI утилита для управления платформой Platform Master Service"
authors = [
    {name = "Platform Team", email = "team@example.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "pyyaml>=6.0.1",
    "docker>=7.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
]

[project.scripts]
platform = "apps_platform.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps_platform"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "S", "PIE", "RUF", "ASYNC", "SIM"]
# RUF001/002/003 — неоднозначные unicode-символы (кириллица/эмодзи в коде проекта)
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# tests: assert, захардкоженные пароли и временные пути допустимы
"tests/*" = ["S101", "S105", "S106", "S108"]
# CLI легитимно вызывает docker через subprocess с частичным путём и читает HostIp
"apps_platform/cli.py" = ["S603", "S607", "S104"]
"apps_platform/service_inspection.py" = ["S603", "S607", "S104"]

[tool.black]
line-length = 120
target-version = ["py311"]
